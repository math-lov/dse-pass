<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>題目／題解工作台 · HKDSE Daily Three</title>
<link rel="stylesheet" href="/katex/katex.min.css?v=2">
<style>
  :root{--bg:#0f1220;--card:#181c2f;--card2:#1f2440;--line:#2b3150;--txt:#e8eaf6;--dim:#9aa0c0;
        --ok:#3ddc97;--bad:#ff6b6b;--warn:#ffc857;--acc:#7c8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14.5px/1.6 system-ui,"Segoe UI","Microsoft JhengHei",sans-serif}
  .layout{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  aside{background:#12162a;border-right:1px solid var(--line);padding:14px;position:sticky;top:0;height:100vh;overflow:auto}
  main{padding:18px 22px 60px;max-width:1100px}
  h1{font-size:17px;margin:0 0 10px}
  h2{font-size:15px;margin:22px 0 8px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:6px}
  a{color:var(--acc)}
  input,textarea,select{font:inherit;background:#121629;color:var(--txt);border:1px solid var(--line);
      border-radius:8px;padding:6px 8px;width:100%}
  textarea{min-height:64px;resize:vertical}
  label{display:block;font-size:12.5px;color:var(--dim);margin:8px 0 3px}
  button{cursor:pointer;font:inherit;padding:7px 12px;border-radius:9px;border:1px solid var(--line);
      background:var(--card2);color:var(--txt)}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:700}
  button.mini{padding:2px 8px;font-size:12px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .qitem{padding:7px 9px;border:1px solid transparent;border-radius:8px;cursor:pointer;display:flex;gap:6px;align-items:center}
  .qitem:hover{background:#1a1f38}
  .qitem.on{background:#22284a;border-color:var(--acc)}
  .qitem .code{font-family:ui-monospace,Consolas,monospace}
  .qitem .sp{flex:1}
  .tag{font-size:11px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .tag.ok{color:var(--ok);border-color:#1d5c46}
  .tag.warn{color:var(--warn);border-color:#5c4a1d}
  .tag.bad{color:var(--bad);border-color:#5c1d1d}
  /* 左側欄：依試卷分組 */
  .pgroup{padding:5px 8px;border-radius:8px;cursor:pointer;display:flex;gap:6px;align-items:center;
          background:#141833;border:1px solid var(--line);margin:10px 0 4px;font-size:13px}
  .pgroup:first-child{margin-top:0}
  .pgroup:hover{border-color:var(--acc)}
  .pgroup .caret{color:var(--acc);width:10px;display:inline-block}
  .pgroup .pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pgroup .sp{flex:1}
  .pitems{padding-left:6px}
  .tabs{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
  .tabs button.on{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:700}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1000px){.two{grid-template-columns:1fr}}
  .pane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .preview{background:#fff;color:#111;border-radius:8px;padding:12px;overflow:auto}
  .preview img{max-width:100%}
  .step{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:var(--card2)}
  .step .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .muted{color:var(--dim);font-size:12.5px}
  .banner{padding:9px 12px;border-radius:9px;margin:10px 0;font-size:13.5px;display:none;white-space:pre-wrap}
  .banner.show{display:block}
  .banner.ok{background:#12301f;border:1px solid #1d5c46;color:#a8f0cd}
  .banner.no{background:#2a1414;border:1px solid #5c1d1d;color:#ffb3b3}
  .cropwrap{position:relative;display:inline-block;max-width:100%}
  .cropwrap img{display:block;max-width:100%}
  .cropbox{position:absolute;border:2px solid #ff4d6d;background:rgba(255,77,109,.12);pointer-events:none}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  code{font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>題目／題解工作台</h1>
    <div class="muted" style="margin-bottom:8px"><a href="/">← 回控制面板</a> · <a href="/releases">發布管理</a></div>
    <input type="text" id="search" placeholder="搜尋題號 / 單元…">
    <div id="list" style="margin-top:10px"></div>
  </aside>

  <main>
    <div id="banner" class="banner"></div>
    <div id="head" class="muted">請從左邊選一題。</div>
    <div id="tabs" class="tabs" style="display:none">
      <button data-tab="q" class="on">題目</button>
      <button data-tab="s">題解</button>
      <button data-tab="c">裁切</button>
      <span class="sp"></span>
      <button id="btnReload" class="mini">重新載入</button>
    </div>

    <!-- ═══ 題目 ═══ -->
    <div id="tab-q" style="display:none">
      <div class="two">
        <div class="pane">
          <h2>題目內容（英文原文 + LaTeX）</h2>
          <label>stem_text（英文題幹；行內數學用 $...$ 包住。寫了 $...$ 之後，系統就不會再自動判斷公式範圍）</label>
          <textarea id="f_stem_text"></textarea>
          <label>stem_latex（獨立顯示的公式，可留空）</label>
          <input id="f_stem_latex">
          <label>選項（LaTeX）</label>
          <div class="two">
            <input id="f_optA" placeholder="A">
            <input id="f_optB" placeholder="B">
            <input id="f_optC" placeholder="C">
            <input id="f_optD" placeholder="D">
          </div>
          <label>figure（圖表描述，學生端可展開）</label>
          <textarea id="f_figure"></textarea>
          <label>notes（印刷備註）</label>
          <textarea id="f_notes"></textarea>
          <div class="row" style="margin-top:12px">
            <button class="primary" id="btnSaveQ">儲存題目文字</button>
            <button id="btnResetQ">還原為原始轉寫</button>
            <span class="muted" id="editFlag"></span>
          </div>
        </div>
        <div class="pane">
          <h2>預覽（與學生端相同）</h2>
          <div class="preview" id="pvQ"></div>
          <h2>學生端實際顯示（儲存後重算）</h2>
          <div class="preview" id="pvStudent"></div>
          <div class="muted">這是學生在網站看到的題幹。若與上面的預覽不同，請先按「儲存題目文字」再回來看。</div>
          <h2>題目原圖</h2>
          <div class="preview"><img id="imgQ" alt="題目圖"></div>
          <div class="row" style="margin-top:8px">
            <span class="muted" id="imgMeta"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══ 題解 ═══ -->
    <div id="tab-s" style="display:none">
      <div class="two">
        <div class="pane">
          <h2>答案與逐步解答</h2>
          <div class="row">
            <div style="width:110px"><label>答案</label>
              <select id="s_answer"><option>A</option><option>B</option><option>C</option><option>D</option></select>
            </div>
            <div style="width:150px"><label>核對狀態</label>
              <select id="s_verify"><option value="checked">checked（已核對）</option>
                <option value="checked-manual">checked-manual（人工核對）</option>
                <option value="unverified">unverified</option></select>
            </div>
            <div style="flex:1"><label>review 備註（會列入需目視確認）</label>
              <input id="s_review">
            </div>
          </div>
          <h2 style="display:flex;align-items:center;justify-content:space-between">
            <span>步驟（steps）</span><button class="mini" id="btnAddStep">+ 新增步驟</button></h2>
          <div id="steps"></div>
          <h2 style="display:flex;align-items:center;justify-content:space-between">
            <span>易錯選項（traps）</span><button class="mini" id="btnAddTrap">+ 新增</button></h2>
          <div id="traps"></div>
          <h2>一句話技巧（tip）</h2>
          <label>English</label><textarea id="t_en"></textarea>
          <label>中文</label><textarea id="t_zh"></textarea>
          <div class="row" style="margin-top:12px">
            <button class="primary" id="btnSaveS">儲存題解</button>
            <span class="muted" id="verFlag"></span>
          </div>
        </div>
        <div class="pane">
          <h2>解答預覽（KaTeX）</h2>
          <div class="preview" id="pvS"></div>
        </div>
      </div>
    </div>

    <!-- ═══ 裁切 ═══ -->
    <div id="tab-c" style="display:none">
      <div class="two">
        <div class="pane">
          <h2>整頁（紅框＝目前裁切範圍）</h2>
          <div class="cropwrap" id="cropWrap">
            <img id="imgPage" alt="整頁">
            <div class="cropbox" id="cropBox"></div>
          </div>
          <div class="muted" id="pageMeta" style="margin-top:6px"></div>
        </div>
        <div class="pane">
          <h2>目前題目圖</h2>
          <div class="preview"><img id="imgCrop" alt="裁切後"></div>
          <h2>調整裁切框（pt）</h2>
          <div class="two">
            <div><label>x0（左）</label><input id="c_x0" type="number" step="1"></div>
            <div><label>x1（右）</label><input id="c_x1" type="number" step="1"></div>
            <div><label>y0（上）</label><input id="c_y0" type="number" step="1"></div>
            <div><label>y1（下）</label><input id="c_y1" type="number" step="1"></div>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="mini" data-nudge="y1:+5">下 +5</button>
            <button class="mini" data-nudge="y1:-5">下 −5</button>
            <button class="mini" data-nudge="y0:-5">上 −5</button>
            <button class="mini" data-nudge="y0:+5">上 +5</button>
            <button class="mini" id="btnAutoBox">載入自動框</button>
          </div>
          <div class="row" style="margin-top:12px">
            <button class="primary" id="btnApplyCrop">套用並重裁</button>
            <button id="btnAutoCrop">回到自動規則</button>
            <span class="muted" id="cropFlag"></span>
          </div>
          <div class="muted" style="margin-top:8px">
            小技巧：先在整頁圖上確認圖形往下到哪裡，再用「下 +5」逐步拉長，右邊預覽會即時更新；
            按「套用並重裁」才會寫入檔案。
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script defer src="/katex/katex.min.js?v=2"></script>
<script defer src="/katex/auto-render.min.js?v=2"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var state = { list: [], cur: null, data: null, tab: "q", busy: false };
  var esc = function(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };

  function banner(msg, kind){
    var b = $("banner");
    b.className = "banner show " + (kind || "ok");
    b.textContent = msg || "";
    if (!msg) b.className = "banner";
  }
  /* 剝掉外圍數學分隔符（$...$、\(...\)、\[...\]）—— 資料層存純 LaTeX，
     但 Gemini 轉寫偶爾會多包一層 $，KaTeX 會把它當非法字元而只顯示原始碼。 */
  function stripDelims(t){
    var s = String(t == null ? "" : t).trim();
    var pairs = [["$","$"],["\\(","\\)"],["\\[","\\]"]];
    for (var i = 0; i < pairs.length; i++){
      var a = pairs[i][0], b = pairs[i][1];
      if (s.length > a.length + b.length - 1 && s.slice(0, a.length) === a && s.slice(-b.length) === b){
        return s.slice(a.length, s.length - b.length).trim();
      }
    }
    return s;
  }
  function kx(el, tex, display){
    if (!tex) { el.textContent = "—"; return; }
    tex = stripDelims(tex);
    if (window.katex){
      try { katex.render(tex, el, { displayMode: !!display, throwOnError: false, strict: false }); return; }
      catch(e){}
    }
    el.textContent = tex;
  }
  /* 選項是「純文字」而非 LaTeX？（與學生端 app.js 同一規則）
     如 "230.0 (correct to 4 significant figures)." —— 數學模式會吃掉空格、單字變斜體。 */
  function isProse(s){
    if (s.indexOf("$") >= 0 || s.indexOf("\\") >= 0) return false;
    return /(^|[^A-Za-z])[A-Za-z]{2,}\s+[A-Za-z]{2,}(?![A-Za-z])/.test(s);
  }
  function autoTex(el, s){
    el.innerHTML = "";
    var d = document.createElement("div");
    d.style.whiteSpace = "pre-wrap";   /* 保留轉寫裡的換行（I. / II. / III. 各佔一行）；$...$ 行內渲染不受影響 */
    d.textContent = s || "";
    el.appendChild(d);
    if (window.renderMathInElement){
      try { renderMathInElement(d, { delimiters:[{left:"$",right:"$",display:false}], throwOnError:false, strict:false }); } catch(e){}
    }
  }
  async function api(path, body){
    var opt = body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {};
    var r = await fetch(path, opt);
    var t = await r.text();
    try { return JSON.parse(t); } catch(e){ return { ok:false, error:"非 JSON 回應：" + t.slice(0,200) }; }
  }

  /* ── 清單 ── */
  async function loadList(){
    var r = await api("/api/qlist");
    state.list = (r.list || []);
    renderList();
  }
  var collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem("wbCollapsed") || "{}") || {}; } catch(e){ collapsed = {}; }
  function saveCollapsed(){ try { localStorage.setItem("wbCollapsed", JSON.stringify(collapsed)); } catch(e){} }

  function qitemNode(q){
    var d = document.createElement("div");
    d.className = "qitem" + (state.cur === q.id ? " on" : "");
    var tags = "";
    if (q.verified) tags += '<span class="tag ok">✓</span>';
    if (q.edited) tags += '<span class="tag warn">✎</span>';
    if (q.cropManual) tags += '<span class="tag warn">✂</span>';
    if (q.review) tags += '<span class="tag bad">!</span>';
    d.innerHTML = '<span class="code">' + esc(q.code) + '</span><span class="muted">'
      + esc(q.answer || "-") + '</span><span class="sp"></span>' + tags;
    d.onclick = function(){ openQ(q.id); };
    return d;
  }

  /* 題目較多時按試卷分組，方便追蹤；新卷入庫會自動多出一組 */
  function renderList(){
    var kw = ($("search").value || "").trim().toLowerCase();
    var host = $("list");
    host.innerHTML = "";
    var hits = state.list.filter(function(q){
      if (!kw) return true;
      return ((q.code || "") + " " + (q.unit || "") + " " + q.id + " " + (q.paperLabel || q.paper || ""))
        .toLowerCase().indexOf(kw) >= 0;
    });
    if (!hits.length){
      var em = document.createElement("div");
      em.className = "muted";
      em.textContent = "沒有符合的題目";
      host.appendChild(em);
      return;
    }
    var groups = [], byKey = {};
    hits.forEach(function(q){
      var key = q.paper || "（未分類）";
      if (!byKey[key]){
        byKey[key] = { key:key, label:q.paperLabel || key, name:q.paperName || "", items:[] };
        groups.push(byKey[key]);
      }
      byKey[key].items.push(q);
    });
    groups.forEach(function(g){
      var open = kw ? true : !collapsed[g.key];        // 搜尋時一律展開
      var head = document.createElement("div");
      head.className = "pgroup" + (open ? " open" : "");
      if (g.name) head.title = g.name;
      var unsolved = g.items.filter(function(q){ return !q.answer; }).length;
      head.innerHTML = '<span class="caret">' + (open ? "▾" : "▸") + '</span>'
        + '<span class="pname">' + esc(g.label) + '</span><span class="sp"></span>'
        + '<span class="muted">' + g.items.length + ' 題'
        + (unsolved ? ' · <span style="color:var(--warn)">未解 ' + unsolved + '</span>' : '')
        + '</span>';
      head.onclick = function(){ collapsed[g.key] = !collapsed[g.key]; saveCollapsed(); renderList(); };
      host.appendChild(head);
      if (!open) return;
      var box = document.createElement("div");
      box.className = "pitems";
      g.items.forEach(function(q){ box.appendChild(qitemNode(q)); });
      host.appendChild(box);
    });
  }
  $("search").oninput = renderList;

  /* ── 開啟一題 ── */
  async function openQ(qid){
    state.cur = qid;
    var cur = state.list.filter(function(x){ return x.id === qid; })[0];
    if (cur && collapsed[cur.paper]){ collapsed[cur.paper] = false; saveCollapsed(); }   // 展開所屬試卷
    renderList();
    banner("");
    var r = await api("/api/q?qid=" + encodeURIComponent(qid));
    if (!r.ok){ banner(r.error || "讀取失敗", "no"); return; }
    state.data = r;
    renderHead(); renderQ(); renderS(); renderC();
    $("tabs").style.display = "flex";
    showTab(state.tab);
  }
  function showTab(t){
    state.tab = t;
    ["q","s","c"].forEach(function(k){ $("tab-" + k).style.display = (k === t ? "" : "none"); });
    Array.prototype.forEach.call($("tabs").querySelectorAll("button[data-tab]"), function(b){
      b.classList.toggle("on", b.dataset.tab === t);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button[data-tab]"), function(b){
    b.onclick = function(){ showTab(b.dataset.tab); };
  });
  $("btnReload").onclick = function(){ if (state.cur) openQ(state.cur); };

  function renderHead(){
    var d = state.data, q = d.bank;
    $("head").innerHTML = '<b style="font-size:16px">' + esc(q.code) + '</b> · '
      + esc((q.topic||{}).zh || (q.topic||{}).en || "") + ' · 難度 ' + q.difficulty
      + ' · 建議 ' + q.timeSec + 's'
      + (d.bank.editedBy ? ' · <span class="tag warn">已人工修訂</span>' : '')
      + (d.verification ? ' · <span class="tag ' + (d.verification.ok ? 'ok' : 'bad') + '">驗算'
          + (d.verification.ok ? '通過' : '不一致') + '</span>' : '');
  }

  /* ── 題目 ── */
  function renderQ(){
    var q = state.data.bank, e = state.data.edits;
    $("f_stem_text").value = (q.stem && q.stem.text) || "";
    $("f_stem_latex").value = (q.stem && q.stem.latex) || "";
    ["A","B","C","D"].forEach(function(L){ $("f_opt" + L).value = (q.options && q.options[L]) || ""; });
    $("f_figure").value = q.figure || "";
    $("f_notes").value = q.notes || "";
    $("editFlag").textContent = e ? ("已有修訂（" + (e.at || "") + "）") : "目前＝原始轉寫";
    var v = Date.now();
    $("imgQ").src = "/images/questions/" + q.id + ".png?v=" + v;
    $("imgMeta").textContent = "檔案：images/questions/" + q.id + ".png";
    updatePvQ();

    // 學生端實際顯示：直接渲染 bank.stem.html（build_bank 產生的版本）
    var sh = $("pvStudent");
    sh.innerHTML = "";
    if (q.stem && q.stem.html){
      var sd = document.createElement("div");
      sd.innerHTML = q.stem.html;
      sh.appendChild(sd);
      if (window.renderMathInElement){
        try { renderMathInElement(sd, { delimiters:[{left:"$",right:"$",display:false}], throwOnError:false, strict:false }); } catch(e){}
      }
    } else {
      sh.textContent = "（此題沒有文字題幹，網站會以顯示公式呈現 stem_latex）";
    }
    ["f_stem_text","f_stem_latex","f_optA","f_optB","f_optC","f_optD"].forEach(function(id){
      $(id).oninput = updatePvQ;
    });
  }
  function updatePvQ(){
    var host = $("pvQ"); host.innerHTML = "";
    var t = document.createElement("div"); t.id = "pvStem";
    if ($("f_stem_text").value.trim()) { host.appendChild(t); autoTex(t, $("f_stem_text").value); }
    if ($("f_stem_latex").value.trim()){
      var m = document.createElement("div"); m.style.margin = "8px 0";
      kx(m, $("f_stem_latex").value, true); host.appendChild(m);
    }
    var opts = document.createElement("div");
    opts.style.marginTop = "10px";
    ["A","B","C","D"].forEach(function(L){
      var row = document.createElement("div");
      row.style.cssText = "display:flex;gap:8px;align-items:center;margin:3px 0";
      var tag = document.createElement("b"); tag.textContent = L + ". ";
      var val = document.createElement("span");
      var rawOpt = $("f_opt" + L).value;
      /* 三路判別（與學生端一致）：含 $＝行內數學、純文字＝原樣、其餘＝純 LaTeX */
      if (rawOpt.indexOf("$") >= 0 || isProse(rawOpt)) autoTex(val, rawOpt);
      else kx(val, rawOpt, false);
      row.appendChild(tag); row.appendChild(val); opts.appendChild(row);
    });
    host.appendChild(opts);
  }
  $("btnSaveQ").onclick = function(){
    if (!state.cur) return;
    var body = {
      stem_text: $("f_stem_text").value,
      stem_latex: $("f_stem_latex").value,
      options: { A: $("f_optA").value, B: $("f_optB").value, C: $("f_optC").value, D: $("f_optD").value },
      figure: $("f_figure").value,
      notes: $("f_notes").value
    };
    save("/api/qtext", body, "題目文字已儲存");
  };
  $("btnResetQ").onclick = function(){
    if (!state.cur || !confirm("還原為 AI 原始轉寫？你的修訂會被刪除。")) return;
    save("/api/qtext", { reset: true }, "已還原為原始轉寫");
  };

  /* ── 題解 ── */
  function renderS(){
    var s = state.data.solution || {};
    var sol = s.solution || {};
    $("s_answer").value = s.answer || "A";
    $("s_verify").value = s.verify || "checked";
    $("s_review").value = s.review || "";
    var host = $("steps"); host.innerHTML = "";
    (sol.steps || []).forEach(function(st, i){ host.appendChild(stepNode(st, i)); });
    if (!(sol.steps || []).length) host.appendChild(stepNode({}, 0));
    var th = $("traps"); th.innerHTML = "";
    (sol.traps || []).forEach(function(t, i){ th.appendChild(trapNode(t, i)); });
    $("t_en").value = (sol.tip || {}).en || "";
    $("t_zh").value = (sol.tip || {}).zh || "";
    $("verFlag").textContent = state.data.verification
      ? ("程式驗算：" + (state.data.verification.ok ? "通過（命中 " + state.data.verification.computed.join(",") + "）"
          : "不一致（程式算得 " + (state.data.verification.computed||[]).join(",") + "）"))
      : "此題未登記驗算";
    updatePvS();
  }
  function stepNode(st, i){
    var d = document.createElement("div");
    d.className = "step"; d.dataset.i = i;
    d.innerHTML =
      '<div class="hd"><b>步驟 ' + (i + 1) + '</b><span class="sp" style="flex:1"></span>'
      + '<button class="mini" data-act="up">↑</button><button class="mini" data-act="down">↓</button>'
      + '<button class="mini" data-act="del">刪除</button></div>'
      + '<div class="two"><div><label>title.en</label><input data-k="titleEn"></div>'
      + '<div><label>title.zh</label><input data-k="titleZh"></div></div>'
      + '<label>math（顯示公式，KaTeX）</label><input data-k="math">'
      + '<div class="two"><div><label>en</label><textarea data-k="en"></textarea></div>'
      + '<div><label>zh</label><textarea data-k="zh"></textarea></div></div>'
      + '<label>highlight（逗號分隔，會渲染成標籤）</label><input data-k="highlight">';
    d.querySelector('[data-k="titleEn"]').value = (st.title || {}).en || "";
    d.querySelector('[data-k="titleZh"]').value = (st.title || {}).zh || "";
    d.querySelector('[data-k="math"]').value = st.math || "";
    d.querySelector('[data-k="en"]').value = st.en || "";
    d.querySelector('[data-k="zh"]').value = st.zh || "";
    d.querySelector('[data-k="highlight"]').value = (st.highlight || []).join(", ");
    Array.prototype.forEach.call(d.querySelectorAll("input,textarea"), function(el){
      el.oninput = function(){
        if (el.dataset.k === "math" || el.dataset.k === "highlight"
            || el.dataset.k === "en" || el.dataset.k === "zh") updatePvS();
      };
    });
    Array.prototype.forEach.call(d.querySelectorAll("button[data-act]"), function(b){
      b.onclick = function(){
        var arr = collectSteps();
        if (b.dataset.act === "del") arr.splice(i, 1);
        else if (b.dataset.act === "up" && i > 0) { var t = arr[i-1]; arr[i-1] = arr[i]; arr[i] = t; }
        else if (b.dataset.act === "down" && i < arr.length - 1) { var u = arr[i+1]; arr[i+1] = arr[i]; arr[i] = u; }
        state.data.solution.solution.steps = arr;
        renderS();
      };
    });
    return d;
  }
  function trapNode(t, i){
    var d = document.createElement("div");
    d.className = "step"; d.dataset.i = i;
    d.innerHTML = '<div class="hd"><b>易錯選項</b>'
      + '<select data-k="opt" style="width:70px"><option>A</option><option>B</option><option>C</option><option>D</option></select>'
      + '<span style="flex:1"></span><button class="mini" data-act="del">刪除</button></div>'
      + '<div class="two"><div><label>en</label><textarea data-k="en"></textarea></div>'
      + '<div><label>zh</label><textarea data-k="zh"></textarea></div></div>';
    d.querySelector('[data-k="opt"]').value = t.opt || "A";
    d.querySelector('[data-k="en"]').value = t.en || "";
    d.querySelector('[data-k="zh"]').value = t.zh || "";
    d.querySelector('button[data-act="del"]').onclick = function(){
      var arr = collectTraps(); arr.splice(i, 1);
      state.data.solution.solution.traps = arr; renderS();
    };
    return d;
  }
  function collectSteps(){
    var out = [];
    Array.prototype.forEach.call($("steps").querySelectorAll(".step"), function(d){
      var g = function(k){ return d.querySelector('[data-k="' + k + '"]').value; };
      var hl = (g("highlight") || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean);
      var st = {
        title: { en: g("titleEn"), zh: g("titleZh") },
        math: g("math"), en: g("en"), zh: g("zh"), highlight: hl
      };
      if (!st.math && !st.en && !st.zh) return;
      out.push(st);
    });
    return out;
  }
  function collectTraps(){
    var out = [];
    Array.prototype.forEach.call($("traps").querySelectorAll(".step"), function(d){
      var g = function(k){ return d.querySelector('[data-k="' + k + '"]').value; };
      if (!g("en") && !g("zh")) return;
      out.push({ opt: g("opt"), en: g("en"), zh: g("zh") });
    });
    return out;
  }
  function updatePvS(){
    var host = $("pvS"); host.innerHTML = "";
    var steps = collectSteps();
    steps.forEach(function(st, i){
      var box = document.createElement("div");
      box.style.margin = "10px 0";
      var tt = document.createElement("div");
      tt.innerHTML = "<b>" + esc((st.title||{}).zh || (st.title||{}).en || ("步驟 " + (i+1))) + "</b>";
      box.appendChild(tt);
      if (st.math){ var m = document.createElement("div"); m.style.margin = "6px 0"; kx(m, st.math, true); box.appendChild(m); }
      var note = document.createElement("div"); note.style.margin = "4px 0";
      autoTex(note, st.zh || st.en || ""); box.appendChild(note);
      if ((st.highlight||[]).length){
        var hs = document.createElement("div"); hs.style.cssText = "display:flex;gap:6px;flex-wrap:wrap";
        st.highlight.forEach(function(h){
          var c = document.createElement("span");
          c.style.cssText = "border:1px solid #ccd;border-radius:6px;padding:2px 8px";
          kx(c, h, false); hs.appendChild(c);
        });
        box.appendChild(hs);
      }
      host.appendChild(box);
    });
    var traps = collectTraps();
    if (traps.length){
      var tr = document.createElement("div");
      tr.innerHTML = "<b>常見錯誤</b><ul style='margin:6px 0 0 18px'>"
        + traps.map(function(t){ return "<li><b>" + t.opt + "</b> " + esc(t.zh || t.en) + "</li>"; }).join("")
        + "</ul>";
      host.appendChild(tr);
    }
    if ($("t_zh").value || $("t_en").value){
      var tp = document.createElement("div");
      tp.innerHTML = "<b>一句話技巧</b>";
      var p = document.createElement("div"); autoTex(p, $("t_zh").value || $("t_en").value);
      tp.appendChild(p); host.appendChild(tp);
    }
    var ans = document.createElement("div");
    ans.style.cssText = "margin-top:10px;font-weight:700";
    ans.textContent = "答案：" + $("s_answer").value;
    host.appendChild(ans);
  }
  $("btnAddStep").onclick = function(){
    var arr = collectSteps();
    arr.push({ title: { en: "", zh: "" }, math: "", en: "", zh: "", highlight: [] });
    state.data.solution.solution.steps = arr; renderS();
  };
  $("btnAddTrap").onclick = function(){
    var arr = collectTraps();
    arr.push({ opt: "A", en: "", zh: "" });
    state.data.solution.solution.traps = arr; renderS();
  };
  $("btnSaveS").onclick = function(){
    if (!state.cur) return;
    var steps = collectSteps();
    if (!steps.length) { banner("至少要有一個步驟", "no"); return; }
    var body = {
      answer: $("s_answer").value,
      verify: $("s_verify").value,
      review: $("s_review").value.trim() || null,
      solution: { steps: steps, traps: collectTraps(),
                  tip: { en: $("t_en").value, zh: $("t_zh").value } }
    };
    save("/api/qsol", body, "題解已儲存");
  };

  /* ── 裁切 ── */
  function renderC(){
    var d = state.data;
    var box = (d.crop && d.crop.crop) || (d.cutIndex && d.cutIndex.cropPt) || d.autoBox;
    if (!box){ $("cropFlag").textContent = "沒有裁切資料"; return; }
    ["x0","y0","x1","y1"].forEach(function(k, i){ $("c_" + k).value = box[i]; });
    var v = Date.now();
    $("imgCrop").src = "/images/questions/" + d.qid + ".png?v=" + v;
    $("cropFlag").textContent = (d.crop && d.crop.crop) ? "人工調整中" : "目前＝自動規則";
    var pg = $("imgPage");
    pg.onload = function(){ drawBox(); };
    pg.src = "/api/pageimg?qid=" + encodeURIComponent(d.qid) + "&v=" + v;
    $("pageMeta").textContent = "整頁：" + (d.cutIndex ? ("第 " + (d.cutIndex.page + 1) + " 頁") : "—");
  }
  function drawBox(){
    var pg = $("imgPage"), cb = $("cropBox");
    if (!pg.naturalWidth || !state.data || !state.data.cutIndex) return;
    var item = state.data.cutIndex;
    var pdf = document.createElement("div");
    // 頁寬 pt 由 /api/q 的 cutIndex 無法得知 → 用圖片比例反推（整頁以 1.5 倍渲染）
    var scale = pg.clientWidth / (pg.naturalWidth / 1.5);
    var box = ["x0","y0","x1","y1"].map(function(k){ return parseFloat($("c_" + k).value) || 0; });
    cb.style.left = (box[0] * scale) + "px";
    cb.style.top = (box[1] * scale) + "px";
    cb.style.width = ((box[2] - box[0]) * scale) + "px";
    cb.style.height = ((box[3] - box[1]) * scale) + "px";
  }
  ["c_x0","c_y0","c_x1","c_y1"].forEach(function(id){ $(id).oninput = drawBox; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-nudge]"), function(b){
    b.onclick = function(){
      var parts = b.dataset.nudge.split(":");
      var key = parts[0], delta = parseFloat(parts[1]);
      var el = $("c_" + key);
      el.value = (parseFloat(el.value) || 0) + delta;
      drawBox();
    };
  });
  window.addEventListener("resize", drawBox);

  $("btnAutoBox").onclick = function(){
    var b = state.data.autoBox;
    if (!b) { banner("沒有自動框可用", "no"); return; }
    ["x0","y0","x1","y1"].forEach(function(k, i){ $("c_" + k).value = b[i]; });
    drawBox();
    banner("已載入自動框（尚未套用）");
  };
  $("btnApplyCrop").onclick = function(){
    if (!state.cur) return;
    save("/api/qcrop", {
      x0: parseFloat($("c_x0").value), y0: parseFloat($("c_y0").value),
      x1: parseFloat($("c_x1").value), y1: parseFloat($("c_y1").value)
    }, "已重裁並記錄為人工調整");
  };
  $("btnAutoCrop").onclick = function(){
    if (!state.cur || !confirm("回到自動裁切規則（會刪除此題的人工調整）？")) return;
    save("/api/qcrop", { mode: "auto" }, "已回到自動規則");
  };

  /* ── 儲存共用 ── */
  async function save(path, body, okMsg){
    if (state.busy) return;
    state.busy = true;
    banner("儲存中…（若修改題目文字，會自動重建題庫）");
    try {
      var r = await api(path + "?qid=" + encodeURIComponent(state.cur), body);
      if (!r.ok){
        var bad = (r.steps || []).filter(function(s){ return s.code !== 0; })[0];
        banner("失敗：" + (r.error || (bad && (bad.cmd + "\n" + bad.out)) || "未知錯誤"), "no");
        return;
      }
      banner(okMsg + "　" + ((r.steps || []).map(function(s){ return s.cmd; }).join("；")));
      await loadList();
      await openQ(state.cur);
    } finally { state.busy = false; }
  }

  // 診斷：KaTeX 樣式沒載入時，數學式會顯示成「重複字符 + 原始 TeX」
  setTimeout(function(){
    var hasCss = false;
    try {
      hasCss = Array.prototype.some.call(document.styleSheets, function(ss){
        return (ss.href || "").indexOf("katex") >= 0 && ss.cssRules && ss.cssRules.length > 0;
      });
    } catch(e){ hasCss = true; }
    if (window.katex && hasCss) return;
    banner("數學排版資源未載入，預覽會顯示成重複字符。請按 Ctrl+F5 強制重新整理。", "no");
  }, 2500);

  loadList();
})();
</script>
</body>
</html>
